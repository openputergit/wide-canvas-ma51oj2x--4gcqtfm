<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHADE EDC - Future of Education</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.skypack.dev/three@0.132.2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #9d00ff;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }

        .neon-border {
            box-shadow: 0 0 10px var(--neon-blue),
                        0 0 20px var(--neon-purple);
        }

        .video-container {
            height: calc(100vh - 60px);
        }

        .glow-text {
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .modal {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .video-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Auth Modal -->
    <div id="authModal" class="modal fixed inset-0 flex items-center justify-center z-50">
        <div class="bg-gray-900 p-8 rounded-xl neon-border max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center glow-text">JHADE EDC</h2>
            <div id="authForms">
                <!-- Login Form -->
                <form id="loginForm" class="space-y-4">
                    <input type="email" placeholder="Email" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <input type="password" placeholder="Password" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 p-3 rounded-lg font-bold hover:opacity-90">Login</button>
                    <p class="text-center">Don't have an account? <a href="#" onclick="toggleForm()" class="text-blue-400">Sign up</a></p>
                </form>
                <!-- Signup Form -->
                <form id="signupForm" class="space-y-4 hidden">
                    <input type="text" placeholder="Username" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <input type="email" placeholder="Email" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <input type="password" placeholder="Password" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 p-3 rounded-lg font-bold hover:opacity-90">Sign Up</button>
                    <p class="text-center">Already have an account? <a href="#" onclick="toggleForm()" class="text-blue-400">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <!-- Navigation -->
        <nav class="fixed top-0 w-full bg-gray-900 z-40">
            <div class="flex items-center justify-between p-4">
                <h1 class="text-2xl font-bold glow-text">JHADE EDC</h1>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="search" placeholder="Search topics..." class="w-64 p-2 bg-gray-800 rounded-lg border border-gray-700">
                        <i class="bi bi-search absolute right-3 top-2.5"></i>
                    </div>
                    <button onclick="showUploadModal()" class="p-2 rounded-full bg-gradient-to-r from-blue-500 to-purple-600">
                        <i class="bi bi-plus-lg text-xl"></i>
                    </button>
                    <button onclick="toggleProfile()" class="p-2">
                        <i class="bi bi-person-circle text-xl"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Video Feed -->
        <div class="video-scroll pt-16 h-screen overflow-y-scroll snap-y snap-mandatory">
            <div class="video-container snap-start flex">
                <!-- Video Player -->
                <div class="w-full relative">
                    <video src="" class="w-full h-full object-cover"></video>
                    <!-- Video Controls -->
                    <div class="absolute bottom-4 right-4 flex flex-col items-center space-y-4">
                        <button class="p-2 rounded-full bg-gray-800"><i class="bi bi-heart text-2xl"></i></button>
                        <button class="p-2 rounded-full bg-gray-800"><i class="bi bi-chat text-2xl"></i></button>
                        <button class="p-2 rounded-full bg-gray-800"><i class="bi bi-share text-2xl"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal fixed inset-0 hidden items-center justify-center z-50">
        <div class="bg-gray-900 p-8 rounded-xl neon-border max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Upload Educational Content</h3>
            <form id="uploadForm" class="space-y-4">
                <input type="file" accept="video/*" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                <input type="text" placeholder="Title" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                <textarea placeholder="Description" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700"></textarea>
                <input type="text" placeholder="Topics (comma separated)" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700">
                <div class="flex space-x-4">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 p-3 rounded-lg">Upload</button>
                    <button type="button" onclick="hideUploadModal()" class="flex-1 bg-gray-800 p-3 rounded-lg">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Auth State
        let isAuthenticated = false;

        // UI Functions
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
        }

        function showUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function hideUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        }

        // Auth Functions
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate login
            isAuthenticated = true;
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            localStorage.setItem('isAuthenticated', 'true');
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate signup
            isAuthenticated = true;
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            localStorage.setItem('isAuthenticated', 'true');
        });

        // Check authentication state on load
        window.addEventListener('load', () => {
            if (localStorage.getItem('isAuthenticated') === 'true') {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            }
        });

        // Upload handling
        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Handle upload logic here
            hideUploadModal();
        });

        // Initialize Three.js background effect
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add ambient animation
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
